name: CI

on:
  pull_request:
    paths:
      - '**.py'
      - 'ruff.toml'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ruff
        run: pip install "ruff>=0.15"

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .
