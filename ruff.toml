target-version = "py310"
line-length = 100

exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    ".secrets",
    ".tox",
]

[lint]
future-annotations = true
# Pragmatic starter set; expand as the tap matures.
#   E/W: pycodestyle errors and warnings
#   F:   pyflakes (undefined names, unused imports)
#   I:   isort (import sorting)
#   UP:  pyupgrade (modern Python idioms)
#   B:   flake8-bugbear (likely-bug patterns)
#   C90: mccabe complexity
#   RUF: ruff-specific rules
select = ["E", "W", "F", "I", "UP", "B", "C90", "RUF"]
ignore = [
    "E731",    # do-not-assign-lambda
    "COM812",  # missing-trailing-comma (handled by formatter)
    "RUF012",  # mutable class default — `primary_keys = ["id"]` is the standard SDK pattern
]

[lint.mccabe]
max-complexity = 12

[lint.flake8-annotations]
allow-star-arg-any = true
